<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kart Circuit</title>
  </head>
  <body>
    <canvas id="scene"></canvas>

    <div id="hud-top">
      <div class="hud-pill" id="hud-left">
        <div id="hud-lap">LAP 1/3</div>
        <div id="hud-surface"></div>
      </div>
      <div class="hud-pill" id="hud-right">
        <div><span class="hud-label">TIME </span><span id="hud-time">0:00.000</span></div>
        <div><span class="hud-label">BEST </span><span id="hud-best">—</span></div>
        <div><span class="hud-label">LAST </span><span id="hud-last">—</span></div>
        <div id="hud-fps">60 FPS</div>
      </div>
    </div>

    <div id="hud-bottom-left">
      <div id="hud-speed">0 km/h</div>
      <div id="boost-wrap">
        <div id="boost-fill"></div>
      </div>
    </div>

    <canvas id="minimap" width="170" height="170"></canvas>

    <div id="overlay">
      <div id="overlay-title"></div>
      <div id="overlay-detail"></div>
    </div>
    <div id="help">
      <b>W/↑</b> accelerate · <b>S/↓/Space</b> brake · <b>A/D or ←/→</b> steer · <b>Shift</b> (while turning) drift → boost · <b>R</b> restart · <b>M</b> music
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
